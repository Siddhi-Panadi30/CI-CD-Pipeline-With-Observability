apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: netflix-db-allow-backend-only
  namespace: netflix
  
spec:
  podSelector:
    matchLabels:
     app: netflix-database
     
  policyTypes:
    - Ingress
    
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: netflix-backend
              
      ports:
        - port: 3306
          protocol: TCP

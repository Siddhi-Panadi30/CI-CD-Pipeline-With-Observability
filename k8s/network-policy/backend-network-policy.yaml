apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netflix-backend-allow-frontend-only
  namespace: netflix
spec:
  podSelector:
    matchLabels:
      netflix-backend-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              netflix-frontend-app
      ports:
        - port: 8080
          protocol: TCP


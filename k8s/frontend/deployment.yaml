apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-frontend
  namespace: netflix
  labels:
    app: netflix-frontend
    
spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: netflix-frontend
      
  template:
    metadata:
      labels:
        app: netflix-frontend
        
    spec:
      automountServiceAccountToken: false
      
      containers:
        - name: frontend
          image:siddhip30/netflix-frontend:v1
          imagePullPolicy: IfNotPresent 
          
          ports:
            - containerPort: 80
              protocol: TCP
              
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              
            limits:
              cpu: 200m
              memory: 128Mi

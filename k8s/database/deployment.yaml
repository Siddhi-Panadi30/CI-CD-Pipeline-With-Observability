apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-db
  namespace: netflix
  labels:
     netflix-app-db
    spec:
  replicas: 1
  strategy:
    type: Recreate # Required for RWO volumes
  selector:
    matchLabels:
      app.kubernetes.io/name: netflix-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netflix-db
        app.kubernetes.io/part-of: netflix
        app.kubernetes.io/component: database
    spec:
      # Security: don't automount service account token (DB doesn't need K8s API)
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              protocol: TCP
          envFrom:
            - secretRef:
                name: netflix-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
                volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: netflix-db-pvc

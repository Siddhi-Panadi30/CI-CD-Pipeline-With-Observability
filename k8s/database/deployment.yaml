apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-db
  namespace: netflix
  labels:
     app: netflix-database
     
    spec:
      replicas: 1

      strategy:
        type: Recreate # Required for RWO volumes
        
      selector:
        matchLabels:
          app: netflix-database
          
      template:
        metadata:
          labels:
            app: netflix-database
            
        spec:
          automountServiceAccountToken: false
      
          containers:
          - name: mysql
            image: mysql:8.0
            
            ports:
            - containerPort: 3306
              protocol: TCP
              
            envFrom:
            - secretRef:
                name: netflix-db-secret
                
            volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
              
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
                
              limits:
                cpu: 500m
                memory: 512Mi
                
          volumes:
            - name: db-storage
              persistentVolumeClaim:
                claimName: netflix-db-pvc
